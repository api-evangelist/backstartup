aid: backstartup
name: Backstartup
description: >-
  Backstartup is a Colombian tech-enabled accounting and legal services firm for
  startups and small businesses (notably SAS entities). It automated company
  formation, bookkeeping, tax filing, payroll, and legal/DIAN compliance for
  founders in Latin America. Backstartup has since been integrated into Numbi
  (numbi.ai), a tech-enabled accounting firm that operates monthly bookkeeping,
  taxes, payroll, and DIAN compliance on top of the accounting systems companies
  already use (Siigo and Alegra), pairing expert accountants with automation and
  AI. Backstartup's legacy domain (backstartup.com) now redirects to numbi.ai and
  Backstartup operates as a sub-organization within Numbi's Colombia operation.
  This is a services-company profile: no public developer API or OpenAPI is
  published. It entered the API Evangelist network as a 500 Global portfolio lead.
